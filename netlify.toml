# Netlify builds only the site code (DESIGN.md: redeploys only when code changes).
# Nightly data lives on GitHub Pages and is fetched in the browser.
[build]
  base = "site"
  command = "npm run build"
  publish = "out"
  # Skip the build when nothing under site/ changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_DATA_BASE = "https://jfwiii.github.io/cbb"

# Teams new since the last deploy have no prebuilt page: serve the client-side fallback.
[[redirects]]
  from = "/team/:slug/*"
  to = "/team/index.html"
  status = 200
